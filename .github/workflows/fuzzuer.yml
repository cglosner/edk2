# Fuzz this edk2 with FuzzUEr, and bring the findings back here as a pull request.
#
# This is the consumer side of the action: FuzzUEr lives in another repository and nothing of
# it is vendored here.
#
# It is checked out with actions/checkout rather than used as `uses: BreakingBoot/FuzzUEr@main`.
# That shorter form does not work for this action, and the failure is not obvious: the runner
# fetches a referenced action as a repository ARCHIVE through an HTTP client with a hard
# 100 second timeout, and FuzzUEr's archive does not arrive inside it. The job then dies in
# "Downloading actions" with
#
#   DownloadActionException: Failed to download archive '...'
#   The request was canceled due to the configured HttpClient.Timeout of 100 seconds elapsing
#
# before a single step of the workflow runs. actions/checkout clones over git instead, which
# that timeout does not apply to, and pinning the ref makes the version explicit.
#
# Needs a SELF-HOSTED runner registered against THIS repository. A run builds
# LLVM-instrumented OVMF and a QEMU that libafl compiles from source; a hosted runner has
# neither the disk nor the job time. A repository-scoped runner serves only its own
# repository, so one registered for the FuzzUEr repo will not pick this up -- the job sits
# in Queued and nothing explains why.
name: FuzzUEr

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Space separated protocol names (blank: everything discovered)'
        required: false
        default: 'EfiAcpiTable EfiHiiFont EfiSmbios EdkiiFormBrowserEx'
      budget:
        description: 'Seconds of fuzzing per target'
        required: false
        default: '300'
      qualify_only:
        description: 'Every stage except the fuzzing -- minutes, not hours'
        type: boolean
        required: false
        default: false
      smm:
        description: 'Build with SMM so SMI handlers have a core to answer'
        type: boolean
        required: false
        default: false
  # Pushing this branch runs it. The branch exists for exercising CI, so a push is the
  # signal; master is deliberately left alone, since it mirrors upstream byte for byte.
  push:
    branches: ['fuzzuer-ci']
  # Weekly, on the day least likely to collide with anything else.
  schedule:
    - cron: '0 4 * * 0'

permissions:
  # The action files the findings issues in THIS repository -- the one whose tree it fuzzed
  # -- so the job token needs to write issues here. No PAT is involved: FuzzUEr never files
  # against its own repo, and it refuses outright to file findings at upstream tianocore.
  # contents stays read: nothing is pushed to a branch any more.
  contents: read
  issues: write

jobs:
  fuzz:
    runs-on: [self-hosted, linux, x64]
    # A qualify run is minutes. A real sweep is per-target, so a couple of hundred protocols
    # at any useful budget is most of a day; the ceiling has to cover the slow case or the
    # job is killed with a partial report already written, which reads as incomplete rather
    # than as cut short.
    timeout-minutes: 720
    steps:
      # The tree under test. Full depth because the pipeline resolves the ref out of git
      # history and makes a worktree of it, and recursive because edk2 vendors its
      # dependencies -- three separate build failures name none of them.
      # No submodules here on purpose. FuzzUEr makes a git worktree of the ref and runs
      # `git submodule update --init --depth=1` on it itself, non-recursively, which is
      # exactly what an OVMF build needs.
      #
      # `submodules: recursive` is actively wrong for edk2: it descends into OpenSSL's own
      # submodules -- fuzz-corpora, krb5, oqs-provider, pkcs11-provider, tlsfuzzer -- which
      # are gigabytes that no firmware build touches, and the job dies in checkout long
      # before any fuzzing. Even `submodules: true` is unnecessary work here.
      - name: Check out this edk2
        uses: actions/checkout@v4
        with:
          path: edk2
          fetch-depth: 0

      # Cloned, not downloaded as an archive -- see the note at the top.
      #
      # submodules: true, NOT recursive. FuzzUEr's own submodules are what the action needs
      # (the harness generator, the sanitizer, the edk2 the port is lifted from), but one of
      # them IS an edk2, so recursing walks into OpenSSL's corpora for the same reason as
      # above. The action initialises anything deeper itself if it needs it.
      - name: Check out FuzzUEr
        uses: actions/checkout@v4
        with:
          repository: BreakingBoot/FuzzUEr
          ref: main
          path: fuzzuer
          submodules: true
          fetch-depth: 1

      # The action keeps its results under the runner's own temp by default, and the
      # runner wipes that when the job ends -- so a failed run left nothing on the box to
      # read and the only copy was an artifact that needs a token to download. Point it at
      # the runner's home instead, keyed by run id. This branch exists to exercise CI; a
      # consumer of the action can leave `out` unset and take the artifact.
      - name: Where to keep the results
        id: where
        shell: bash
        run: echo "out=$HOME/fuzzuer-ci-out/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Fuzz it
        id: fuzz
        uses: ./fuzzuer
        with:
          source: edk2
          # The fallback matters: on a push or the schedule there are no inputs, and an
          # EMPTY targets means every protocol discovered -- 245 of them, which at any
          # useful budget is most of a day. A named handful keeps an unattended trigger
          # to something that finishes; widen it from the dispatch form deliberately.
          targets: ${{ github.event.inputs.targets || 'EfiAcpiTable EfiHiiFont EfiSmbios EdkiiFormBrowserEx' }}
          budget: ${{ github.event.inputs.budget || '300' }}
          qualify-only: ${{ github.event.inputs.qualify_only || 'false' }}
          smm: ${{ github.event.inputs.smm || 'false' }}
          # File the findings here when triage attributes candidates to firmware code:
          # one issue per candidate plus one for the run. A clean run files nothing, which
          # is the point -- a sweep yields candidates and most are not defects. Re-running
          # files nothing already open, so the weekly cron does not repeat itself.
          open-issues: true
          out: ${{ steps.where.outputs.out }}

      - name: Say where the results are
        if: always()
        shell: bash
        env:
          OUT: ${{ steps.where.outputs.out }}
        run: |
          echo "results kept at $OUT"
          ls -la "$OUT" 2>/dev/null | head -20 || echo "(the run created nothing there)"

      # Always, including on failure: a run that fell over at a stage is exactly when the
      # logs are worth having.
      - name: Upload everything the run produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzuer-${{ github.run_id }}
          path: |
            ${{ steps.fuzz.outputs.results }}/pipeline.log
            ${{ steps.fuzz.outputs.results }}/run.json
            ${{ steps.fuzz.outputs.results }}/bugs.md
            ${{ steps.fuzz.outputs.results }}/bugs.json
            ${{ steps.fuzz.outputs.results }}/presence.csv
            ${{ steps.fuzz.outputs.results }}/bench_cases.log
            ${{ steps.fuzz.outputs.results }}/*.log
            ${{ steps.fuzz.outputs.results }}/campaigns/*/crashes.csv
            ${{ steps.fuzz.outputs.results }}/campaigns/*/log.json
            ${{ steps.fuzz.outputs.results }}/campaigns/*/run.log
            ${{ steps.fuzz.outputs.results }}/campaigns/*/fuzz.txt
            ${{ steps.fuzz.outputs.results }}/reproducers/**
          if-no-files-found: warn

      - name: What the run concluded
        if: always()
        shell: bash
        env:
          STAGES: ${{ steps.fuzz.outputs.stages }}
          CANDIDATES: ${{ steps.fuzz.outputs.candidates }}
          RUN_ISSUE: ${{ steps.fuzz.outputs.run-issue }}
          FILED: ${{ steps.fuzz.outputs.issues-filed }}
        run: |
          {
            echo "### FuzzUEr"
            echo
            echo "- stages passed: \`${STAGES:-unknown}\`"
            echo "- candidates: \`${CANDIDATES:-none (triage did not run)}\`"
            echo "- issues filed: \`${FILED:-0}\`"
            if [ -n "${RUN_ISSUE:-}" ]; then
              echo "- run issue: $RUN_ISSUE"
            else
              echo "- no run issue: either nothing was attributed to firmware code, every"
              echo "  candidate was already filed, or the token could not write issues."
              echo "  The artifact has everything either way."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
